<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather_ForeCast</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="headofPage">
        <h1>Weather Forecast</h1>
        <div>
            <select id="unitchoosen">Unit of temperature
                <option value="">Unit of temperature</option>
                <option value="standard" selected>Kelvin</option>
                <option value="metric">Celsius</option>
                <option value="imperial">Fahrenheit</option>
            </select>
        </div>        
    </div>
    
    <div id="container">
        <div id="part1">
            <form>
                <label for="city"><strong>ENTER A CITY :</strong></label>
                <input id="city" type="text" placeholder="Bangalore">

                <input id="button" type="submit">
            </form>
            <p>-----OR-----</p>
            <!-- code to include User's current location -->
            <!-- Current location -->
            <button id="currentLocation">Use Current Location</button>
        </div>
        <div id="part2">

        </div>
    </div>
    <script src = "work.js"></script>
</body>
</html>
